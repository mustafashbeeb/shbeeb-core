name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'android/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build standalone ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Verify translations
        run: |
          node scripts/translations/verify.mjs
          node scripts/verify-arabic.mjs
      - name: Typecheck and JavaScript tests
        run: |
          yarn typecheck
          yarn test --runInBand
      - name: Prepare personal test build
        shell: bash
        run: |
          cp .env.example .env
          node scripts/checkBrandFonts.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          source = path.read_text()
          old = "signingConfig signingConfigs.release"
          assert source.count(old) == 1, "Release signing configuration changed; review before building."
          source = source.replace(old, """signingConfig signingConfigs.debug
                      firebaseCrashlytics {
                          mappingFileUploadEnabled false
                          nativeSymbolUploadEnabled false
                      }""")
          path.write_text(source)
          PY
          chmod +x android/gradlew
      - name: Build APK with bundled JavaScript
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease --build-cache --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
      - name: Verify and name APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/shbeeb-core-arm64.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose apk/shbeeb-core-arm64.apk
          cd apk
          sha256sum shbeeb-core-arm64.apk > SHA256SUMS.txt
          cat > README.txt <<'NOTE'
          Shbeeb Core personal test build (ARM64), based on AnythingLLM.
          Release JavaScript is bundled: no Metro development server is needed.
          Signed with the upstream public debug key for testing only.
          Not an official upstream release or a production signing identity.
          Existing official installations use a different signature.
          No language model or provider credentials are included.
          NOTE
      - uses: actions/upload-artifact@v4
        with:
          name: shbeeb-core-arm64
          path: apk/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  android-smoke:
    name: Android runtime and UI smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Prepare bundled test build
        run: |
          cp .env.example .env
          node scripts/checkBrandFonts.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text().replace('signingConfig signingConfigs.release', 'signingConfig signingConfigs.debug\n            firebaseCrashlytics { mappingFileUploadEnabled false; nativeSymbolUploadEnabled false }')
          p.write_text(s)
          PY
          chmod +x android/gradlew
      - name: Build emulator APK and instrumentation
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest --build-cache --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb install android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -r com.anythingllm.test/androidx.test.runner.AndroidJUnitRunner | tee runtime-test.log
            mkdir -p runtime-evidence
            adb pull /sdcard/Android/data/com.anythingllm/files/core-screenshots runtime-evidence/ || true
            adb logcat -d -s AndroidRuntime ReactNativeJS > runtime-evidence/logcat.txt
            cp runtime-test.log runtime-evidence/
            rg 'OK \(2 tests\)' runtime-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-android-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: ignore
